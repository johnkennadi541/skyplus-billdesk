name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: this workflow reads code and runs tests, nothing else.
permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The repository has no Gradle wrapper yet, so the runner supplies Gradle.
      # The wrapper is committed once a build machine generates it.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run unit tests
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: warn

  # The debug certificate fingerprints, printed on every push so nobody needs
  # Android Studio or a terminal to get them. Google Cloud needs these for the
  # Android OAuth client. The release fingerprints come from the manual
  # "Signing fingerprints" workflow instead.
  debug-fingerprints:
    name: Debug signing fingerprints
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Print the debug certificate
        run: |
          gradle --no-daemon --quiet signingReport > report.txt 2>&1 || true
          echo "===== DEBUG CERTIFICATE ====="
          grep -E "Variant:|Config:|Store:|Alias:|SHA1:|SHA-256:|Valid until:" report.txt || tail -40 report.txt
